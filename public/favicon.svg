<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Safe Haven Inspections">
  <!--
    Simplified Safe Haven mark: the interlocking circles from the full lockup.
    The "SAFE HAVEN" wordmark and the two rules that frame it are dropped on
    purpose — rendered at 16px they merge with the circles into a solid blob.
    The rings alone stay legible all the way down. Strokes are heavier than the
    source artwork so the shape holds at tab size. Gold sampled from the logo
    PNG (#D19A3E). Geometry keeps the source's centre-distance:radius ratio.
  -->
  <g fill="none" stroke="#D19A3E" stroke-width="8">
    <circle cx="34" cy="50" r="28" />
    <circle cx="66" cy="50" r="28" />
  </g>
</svg>
