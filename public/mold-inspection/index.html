<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      STATIC REDIRECT: /mold-inspection/ -> /services/mold-inspection/

      This replaces a TanStack `beforeLoad` redirect route that never worked in
      production. A route-level redirect renders no HTML at build time, so
      GitHub Pages had nothing to serve here and returned its own 404 page. See
      the note in ../mold-inspection-greenacres/index.html for why a zero-delay
      meta refresh plus a canonical is the right static substitute for a 301.
    -->
    <title>Redirecting to Safe Haven Inspections</title>
    <link rel="canonical" href="https://www.safehaveninspectionsllc.com/services/mold-inspection/" />
    <meta
      http-equiv="refresh"
      content="0; url=https://www.safehaveninspectionsllc.com/services/mold-inspection/"
    />
    <script>
      window.location.replace("https://www.safehaveninspectionsllc.com/services/mold-inspection/");
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f8fafc;
        padding: 1.5rem;
        text-align: center;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <p>
      This page has moved to
      <a href="https://www.safehaveninspectionsllc.com/services/mold-inspection/"
        >what a mold inspection includes</a
      >.
    </p>
  </body>
</html>
